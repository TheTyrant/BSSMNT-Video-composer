<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DJ Visualizer &ndash; Output</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #p5-canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #waiting {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.5);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 14px;
      }
    </style>
    <script src="vendor/p5.min.js"></script>
  </head>
  <body>
    <div id="p5-canvas"></div>
    <div id="spectrum-visualizer" style="display:none;"></div>
    <div id="waiting">Connecting to control window&hellip;</div>

    <!-- No visualizer.js here on purpose: this window calls the opener's own
         DJVisualizer instance methods directly (see output.js), so loading a
         second copy of the class would be dead code. -->
    <script src="app/output.js"></script>
  </body>
</html>
